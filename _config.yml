### Site Settings ###
title               : Ronak Mistry
description         : >-
                      Mechanical Design Engineer in Mississauga, Ontario. Product development, 3D CAD, mechanical assemblies, design verification, and manufacturing support. CSWA Certified and OACETT Member; P.Eng. Applicant.

baseurl             : ""            # Change to empty quotes if you are hosting your site at <your-username>.github.io directly
repository          : designbyronak7/designbyronak7.github.io      # Change to <your-username>/<your-username>.github.io (or remove it if you don't need remote projects)
remote_theme        : yousinix/portfolYOU
open_new_tab        : true                    # Opens external URLs in new tab (works for posts, projects and navbar only)


### Plugins ###
plugins:
  - jemoji


### Navbar Settings ###
nav_exclude:                                            # The following paths are excluded from navbar
  - pages/tags.html
  - pages/404.html
  - pages/index.md
  - documentation/partials/**                           # For Documentation Only


### Author Info ###
author:
  name              : Ronak Mistry
  image             : /assets/img/ronak-mark.svg
  email             : ronak.mistry98@gmail.com


### Posts ###
permalink: /blog/:title


### Collections ###
collections:
  projects:
    output: true
    permalink: /projects/:name
  elements:                                             # For Documentation Only
    output: true                                        # For Documentation Only


### Analytics ###
analytics:
  enabled: false                                        # Set true to enable analytics


### Defaults for collections ###
defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "page"
  - scope:                                              # For Documentation Only
      path: ""                                          # For Documentation Only
      type: "elements"                                  # For Documentation Only
    values:                                             # For Documentation Only
      layout: "element"                                 # For Documentation Only
  - scope:
      path: ""
      type: "posts"
    values:
      comments: false                                   # Set to true to enable disqus comments


### Exclude from processing ###
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CONTRIBUTING.md
  - LICENSE
  - "*.log"
