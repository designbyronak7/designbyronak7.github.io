  <rect width="720" height="405" fill="#142634"/><rect width="720" height="405" fill="url(#grid)"/>
  <text x="42" y="48" fill="#91b4c2" font-family="monospace" font-size="13" letter-spacing="3">BRANCH DISTRIBUTION / CONCEPT ONLY</text>
  <path d="M72 190H648" stroke="#d7e1df" stroke-width="10"/>
  <path d="M165 190V112M276 190V278M389 190V112M500 190V278M596 190V112" stroke="#d7e1df" stroke-width="8"/>
  <g fill="#243e4d" stroke="#dc9250" stroke-width="3">
    <rect x="145" y="164" width="40" height="52" rx="2"/><rect x="256" y="164" width="40" height="52" rx="2"/>
